# Odense Monster League spawn service (GDD "Encounters and spawning").
# Deploy: see docs/DEPLOY.md, "Spawn service". The secret SPAWN_SECRET is set with
# `wrangler secret put SPAWN_SECRET` and never stored in this repo; local dev reads .dev.vars.
name = "oml-spawn-service"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true
# No Wrangler usage telemetry from this project.
send_metrics = false

# Privacy: no request logs. Workers Logs/observability and Logpush stay off.
logpush = false

[observability]
enabled = false

[observability.logs]
enabled = false

# Basic per-client rate limit (free tier). The key is the client IP, used in memory only.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
