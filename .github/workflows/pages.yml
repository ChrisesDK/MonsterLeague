name: Deploy client to GitHub Pages

# Builds apps/client and publishes it to GitHub Pages, so testers can open the playtest
# on their own phones. Requires Settings → Pages → Source: "GitHub Actions" (see docs/DEPLOY.md,
# option A). In a private repo (option B, Cloudflare Pages) pushes skip this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Private repos deploy with Cloudflare Pages instead; manual runs are always allowed.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - name: Build client
        run: |
          # Project sites live at /<repo>/; a user site (<name>.github.io) lives at /.
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export VITE_BASE=/
          else
            export VITE_BASE=/${{ github.event.repository.name }}/
          fi
          export APP_VERSION=${GITHUB_SHA::7}
          # Spawn service URL (repo variable, not a secret). Empty → the map shows
          # "spawn service not configured" and the playtest keeps working.
          export VITE_SPAWN_SERVICE_URL="${{ vars.SPAWN_SERVICE_URL }}"
          pnpm --filter @oml/client build
          # Fail the deploy if any built URL ignores the base path.
          pnpm --filter @oml/client check:base
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
