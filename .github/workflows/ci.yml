name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - name: Base-path check (GitHub Pages sub-path build)
        run: pnpm --filter @oml/client build && pnpm --filter @oml/client check:base
        env:
          VITE_BASE: /OdenseMonsterLeague/
      - name: Spawn density targets (GDD)
        run: pnpm spawn:report
      - name: Spawn service bundles (Wrangler dry run, no account needed)
        run: pnpm --filter @oml/spawn-service exec wrangler deploy --dry-run --outdir dist
      - name: Sim smoke test
        run: pnpm sim --a starter_fire:12 --b leader_water --n 1000
